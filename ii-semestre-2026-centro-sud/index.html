<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GARE 2026">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>GARE 2026 · II Semestre Centro Sud</title>
<style>

:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --card:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --bar:#2a78d6;
  --good:#0ca30c; --good-ink:#006300; --warn-ink:#9a6a00; --bad:#d03b3b;
  --good-bg:#e9f6e9; --warn-bg:#fdf3dc; --bad-bg:#fbe9e9; --wait-bg:#f0efec;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#222220; --card:#1a1a19;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --bar:#3987e5;
    --good-ink:#0ca30c; --warn-ink:#fab219; --bad:#e66767;
    --good-bg:#14260f; --warn-bg:#2e2410; --bad-bg:#301616; --wait-bg:#262624;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#222220; --card:#1a1a19;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --bar:#3987e5;
  --good-ink:#0ca30c; --warn-ink:#fab219; --bad:#e66767;
  --good-bg:#14260f; --warn-bg:#2e2410; --bad-bg:#301616; --wait-bg:#262624;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
header p{margin:0;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0 4px}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.sw{width:14px;height:10px;border-radius:3px;background:var(--bar)}
.ln{width:2px;height:14px;background:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-ok{color:var(--good-ink);background:var(--good-bg)}
.s-quasi{color:var(--warn-ink);background:var(--warn-bg)}
.s-ko{color:var(--bad);background:var(--bad-bg)}
.s-wait{color:var(--ink-2);background:var(--wait-bg)}

.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
.vs{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--card)}
.vs.lead{border:2px solid var(--good)}
.vs h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.vs .big{font-size:38px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-top:4px}
.vs .big small{font-size:14px;font-weight:400;color:var(--ink-2);letter-spacing:0}
.vs .line{font-size:14px;color:var(--ink-2);margin-top:4px}
.vs .line b{color:var(--ink)}

.group{margin-top:26px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;
  border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.ghead h2{margin:0;font-size:20px}
.ghead p{margin:0;font-size:14px;color:var(--ink-2)}
.ghead p b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.ag{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;
  border-top:5px solid var(--st)}
.ag.ok{--st:var(--good)} .ag.quasi{--st:#fab219} .ag.ko{--st:var(--bad)} .ag.wait{--st:var(--axis)}
.ag .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ag .nm{font-weight:700;font-size:16px;line-height:1.25}
.ag .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ag .pct{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.ag .pct > b{font-size:34px;line-height:1;letter-spacing:-.02em}
.ag .pct span{font-size:13px;color:var(--ink-2)}
.track{position:relative;height:14px;background:var(--grid);border-radius:4px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:4px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.ag .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-top:6px}
.ag .meta b{color:var(--ink)}
.ag .manca{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--surface);font-size:14px}
.ag .manca b{font-size:16px}
.ag .manca.done{color:var(--good-ink);font-weight:700}
.mini{display:grid;grid-template-columns:auto 1fr 54px;gap:5px 10px;align-items:center;margin-top:12px;font-size:13px}
.mini .l{color:var(--ink-2)}
.mini .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.mtrack{position:relative;height:6px;background:var(--grid);border-radius:3px}
.mfill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:3px}
.m100{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:28px;line-height:1.6}
.note b{color:var(--ink-2)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--page);font-size:13px;
  padding:8px 10px;border-radius:8px;max-width:260px;display:none;z-index:9;line-height:1.4}
@media (max-width:620px){
  .duel{grid-template-columns:1fr}
  .vs .big{font-size:32px}
}

[hidden]{display:none!important}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 22px;
  width:100%;max-width:340px;display:grid;gap:14px;text-align:center;position:relative}
#lock h1{margin:0;font-size:22px}
#lock .n{font-size:14px;color:var(--ink-2)}
#lock input[type=password]{font-size:22px;text-align:center;padding:10px;border-radius:8px;
  border:1px solid var(--axis);background:var(--surface);color:var(--ink)}
#lock button{background:var(--bar);color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
#lockMsg{font-size:13px;min-height:20px;color:var(--ink-2)}
#lockMsg.err{color:var(--bad)}
.torna{display:inline-block;margin-top:14px;font-size:14px;color:var(--ink-2)}
</style>
</head>
<body>
<div id="lock" hidden>
  <form id="lockForm" method="post" action="#">
    <h1>II Semestre 2026 Centro Sud</h1>
    <div class="n">Dati riservati agli agenti · stesso PIN del cruscotto</div>
    <input type="text" name="username" autocomplete="username" value="Cruscotto MAK - PIN generale" readonly tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0">
    <input id="pin" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="32" required aria-label="PIN">
    <label class="n" style="display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer"><input type="checkbox" id="ric" style="width:20px;height:20px"> Ricordami su questo dispositivo</label>
    <button type="submit">Apri</button>
    <div id="lockMsg" role="status"></div>
  </form>
</div>

async function leggi(){ try { const v = localStorage.getItem('mak26_k_gen'); return v ? await crypto.subtle.importKey('raw', b64(v), 'AES-GCM', false, ['decrypt']) : null; } catch(e){ return null; } }
async function salva(k){ try { const r = new Uint8Array(await crypto.subtle.exportKey('raw', k)); localStorage.setItem('mak26_k_gen', btoa(String.fromCharCode(...r))); } catch(e){} }
async function apri(k){ const b = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(L.iv)}, k, b64(L.ct)); return JSON.parse(new TextDecoder().decode(b)); }
async function daPin(pin){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(L.salt), iterations:L.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
function mostra(P){
  document.getElementById('lock').hidden = true;
  document.getElementById('app').innerHTML = P.html +
    '<div class="wrap" style="padding-top:0"><a class="torna" href="../">← Cruscotto MAK 2026</a></div>';
  const s = document.createElement('script'); s.textContent = P.js; document.body.appendChild(s);
}
(async () => {
  const k = await leggi();
  if (k) { try { mostra(await apri(k)); return; } catch(e){} }
  const lock = document.getElementById('lock'), pin = document.getElementById('pin'), msg = document.getElementById('lockMsg');
  lock.hidden = false; pin.focus();
  document.getElementById('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); msg.className = ''; msg.textContent = 'Apro…';
    try {
      const k2 = await daPin(pin.value.trim()), P = await apri(k2);
      if (document.getElementById('ric').checked) await salva(k2);
      mostra(P);
    } catch(err) { msg.className = 'err'; msg.textContent = 'PIN errato. Riprova.'; pin.value = ''; pin.focus(); }
  });
})();
</script>
