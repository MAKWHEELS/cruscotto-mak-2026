<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161B; --surface:#1D2026; --surface2:#23262E; --line:#2E323B;
  --text:#E8EAED; --muted:#9AA0AB;
  --amber:#F5A623; --blue:#5B9CFF; --green:#3DDC84; --red:#FF5C5C;
  --radius:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,.big{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(20,22,27,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:700;text-transform:uppercase}
header h1 span{color:var(--amber)}
.upd{color:var(--muted);font-size:12px}
.sel{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.sel label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;font-family:inherit;cursor:pointer}
select:focus{outline:2px solid var(--amber);outline-offset:1px}
main{max-width:1240px;margin:0 auto;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.zone{color:var(--muted);font-size:13px;margin-bottom:18px}
.zone b{color:var(--text)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.kpi .big{font-size:34px;font-weight:700;line-height:1.05}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)} .amb{color:var(--amber)}
section{margin-bottom:28px}
section>h2{font-size:20px;font-weight:600;text-transform:uppercase;color:var(--text);margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section>h2 small{font-family:Inter;font-size:12px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.row2{grid-template-columns:1fr 1fr}
.row3{grid-template-columns:repeat(3,1fr)}
.row4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.row2,.row3,.row4{grid-template-columns:1fr}.span2{grid-column:auto!important}}
@media(max-width:600px){header{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.sel{margin-left:0}}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
#lock h1{font-size:28px;text-transform:uppercase}#lock h1 span{color:var(--amber)}
#pin{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:22px;letter-spacing:.15em;text-align:center;font-family:'Barlow Condensed',sans-serif;width:100%}
#pin:focus,#lock button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#lock button{background:var(--amber);color:var(--bg);border:0;border-radius:8px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;cursor:pointer}
#lockMsg{font-size:13px;color:var(--muted);min-height:20px}#lockMsg.err{color:var(--red)}
.chartbox{position:relative;height:280px}
.gaugebox{position:relative;height:190px}
.gauge-val{position:absolute;left:0;right:0;bottom:18px;text-align:center}
.gauge-val .big{font-size:38px;font-weight:700}
.gauge-val .sub{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;margin:2px 4px 2px 0}
.tag.ok{background:rgba(61,220,132,.15);color:var(--green)}
.tag.ko{background:rgba(255,92,92,.13);color:var(--red)}
.tag.na{background:var(--surface2);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me{background:rgba(245,166,35,.08)}
tr.me td{font-weight:600}
tr.dim td{color:var(--muted)}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dot{width:54px;text-align:center}
.dot .c{width:30px;height:30px;border-radius:50%;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--line);color:var(--muted)}
.dot.ok .c{background:rgba(61,220,132,.15);border-color:var(--green);color:var(--green)}
.dot.ko .c{background:rgba(255,92,92,.1);border-color:var(--red);color:var(--red)}
.dot .m{font-size:10px;color:var(--muted);text-transform:uppercase}
.dot.sep{width:1px;background:var(--line);margin:0 6px}
.obi4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.obi4 .card{padding:14px}
.obi4 .t{font-size:12px;color:var(--muted);margin-bottom:8px;min-height:34px}
.obi4 .v{font-family:'Barlow Condensed';font-size:24px;font-weight:700}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 30px}
.semtabs{display:flex;gap:8px;margin-bottom:12px}
.semtabs button{background:var(--surface2);border:1px solid var(--line);color:var(--muted);padding:6px 16px;border-radius:8px;font-family:'Barlow Condensed';font-size:15px;font-weight:600;cursor:pointer;text-transform:uppercase}
.semtabs button.on{background:var(--amber);border-color:var(--amber);color:#14161B}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.note b{color:var(--text)}
.rule{margin-top:14px;padding:12px 14px;border-left:3px solid var(--amber);background:var(--surface2);border-radius:6px;font-size:13px}
#lock2[hidden]{display:none!important}
#lock2{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);align-items:center}
#pin2:focus{outline:2px solid var(--amber);outline-offset:1px}
#lock2 .annulla{background:transparent;color:var(--muted);border:1px solid var(--line)}

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

// chiave dal codice (PBKDF2): si può ricordare sul dispositivo, il codice in chiaro no
async function chiaveDa(pin, L){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(L.salt), iterations:L.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function apriCon(key, L){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(L.iv)}, key, b64(L.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const CHIAVI = { // accessi ricordati: 'gen' = PIN generale, 'dir' = direzionali
  async leggi(n){ try { const v = localStorage.getItem('mak26_k_'+n); return v ? await crypto.subtle.importKey('raw', b64(v), 'AES-GCM', false, ['decrypt']) : null; } catch(e){ return null; } },
  async salva(n, key){ try { const r = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem('mak26_k_'+n, btoa(String.fromCharCode(...r))); } catch(e){} },
  togli(n){ try { localStorage.removeItem('mak26_k_'+n); } catch(e){} },
  ci(){ try { return !!(localStorage.getItem('mak26_k_gen') || localStorage.getItem('mak26_k_dir')); } catch(e){ return false; } }
};
// prova l'accesso ricordato; se il codice è cambiato lo dimentica e restituisce null
async function apriRicordato(n, L){
  const k = await CHIAVI.leggi(n); if(!k) return null;
  try { return await apriCon(k, L); } catch(e){ CHIAVI.togli(n); return null; }
}
async function apriConCodice(pin, L, n, ricorda){
  const k = await chiaveDa(pin, L), d = await apriCon(k, L);
  if(ricorda) await CHIAVI.salva(n, k);
  return d;
}

// Online tutta la pagina (testi, regole, grafici e numeri) è nel blocco cifrato:
// P = {data, app, js}. In locale P = {data} e la pagina è già tutta qui.
function mostra(P){
  const app = document.getElementById('app');
  if (P.app != null) {
    app.innerHTML = P.app;
    const s = document.createElement('script'); s.textContent = P.js; document.body.appendChild(s);
  }
  app.hidden = false;
  const esci = document.getElementById('esci');
  if (esci && DATI_CIFRATI) { esci.hidden = false; esci.onclick = () => { CHIAVI.togli('gen'); CHIAVI.togli('dir'); location.reload(); }; }
  avvia(P.data);
}

if (DATI_IN_CHIARO) mostra({data: DATI_IN_CHIARO});
else (async () => {
  const lock = document.getElementById('lock'), msg = document.getElementById('lockMsg'), pin = document.getElementById('pin');
  const gia = await apriRicordato('gen', DATI_CIFRATI);
  if (gia) { mostra(gia); return; }
  lock.hidden = false; pin.focus();
  document.getElementById('lockForm').addEventListener('submit', async e=>{
    e.preventDefault();
    msg.className = ''; msg.textContent = 'Apro…';
    let d;
    try {
      d = await apriConCodice(pin.value.trim(), DATI_CIFRATI, 'gen', document.getElementById('ric1').checked);
    } catch(err) {
      msg.className = 'err'; msg.textContent = 'PIN errato. Riprova.'; pin.value = ''; pin.focus(); return;
    }
    lock.hidden = true; mostra(d);
  });
})();
